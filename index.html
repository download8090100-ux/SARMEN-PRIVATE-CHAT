
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SARMEN PRIVATE</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d14;color:#fff;font-family:Tahoma,Arial;display:flex;justify-content:center;padding:15px}
main{width:100%;max-width:500px;background:#151d2a;padding:20px;border-radius:18px;margin-top:25px}
h1{text-align:center;color:#ed3949;letter-spacing:4px}
input,button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:9px;font-size:15px}
input{background:#080e18;color:white;border:1px solid #344156}
button{background:#b92739;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4}
.alt{background:#34445b}
.green{background:#14794e}
.status{background:#080e18;padding:13px;border-radius:9px;margin:15px 0;text-align:center;font-size:13px;line-height:1.8}
#rolePanel,#appPanel{display:none}
#messages{height:280px;overflow:auto;background:#080e18;padding:10px;border-radius:10px;margin:15px 0}
.msg{padding:10px;background:#26364b;border-radius:9px;margin:8px 0;overflow-wrap:anywhere}
.mine{background:#8c2938}
.small{font-size:12px;color:#aab5c7;text-align:center;line-height:1.8}
</style>
</head>
<body>
<main>
<h1>SARMEN</h1>
<p class="small">PRIVATE CHAT & VOICE</p>

<section id="loginPanel">
<input id="username" value="movsesian" placeholder="نام کاربری">
<input id="password" type="11arsine11" placeholder="رمز عبور">
<button onclick="login()">ورود به سایت</button>
</section>

<section id="rolePanel">
<p class="small">نقش این گوشی را انتخاب کن</p>
<button onclick="startConnection('host')">گوشی اول</button>
<button class="alt" onclick="startConnection('guest')">گوشی دوم</button>
</section>

<section id="appPanel">
<div class="status" id="status">در حال اتصال...</div>
<div id="messages"></div>
<input id="msgInput" placeholder="پیام بنویس..." disabled>
<button id="sendBtn" onclick="sendMessage()" disabled>ارسال پیام</button>

<hr style="border-color:#344156;margin-top:20px">
<p class="small">تماس صوتی دوطرفه</p>
<button id="callBtn" class="green" onclick="makeCall()" disabled>شروع تماس صوتی</button>
<button id="answerBtn" onclick="answerCall()" style="display:none">پاسخ به تماس</button>
<button id="hangBtn" class="alt" onclick="hangup()" disabled>قطع تماس</button>
<div class="status" id="callStatus">آماده تماس</div>
<audio id="remoteAudio" autoplay playsinline></audio>
<button id="audioBtn" class="alt" style="display:none" onclick="playAudio()">پخش صدای طرف مقابل</button>
<button class="alt" onclick="location.reload()">خروج</button>
</section>
</main>

<script>
// تنظیمات ورود
const USERNAME = "movsesian";
const PASSWORD = "11arsine11";

// شناسه داخلی دو گوشی
function hash(s){
 let h=2166136261;
 for(let i=0;i<s.length;i++){
  h^=s.charCodeAt(i);
  h=Math.imul(h,16777619);
 }
 return (h>>>0).toString(36);
}

const key=hash(USERNAME.toLowerCase()+"|"+PASSWORD);
const HOST="sarmen-"+key+"-host";
const GUEST="sarmen-"+key+"-guest";

let peer=null;
let role=null;
let conn=null;
let localStream=null;
let activeCall=null;
let incomingCall=null;
let retryTimer=null;
let connecting=false;
let attemptTimer=null;

const el=id=>document.getElementById(id);

function login(){
 const u=el("username").value.trim().toLowerCase();
 const p=el("password").value;

 if(u!==USERNAME.toLowerCase()||p!==PASSWORD){
  alert("نام کاربری یا رمز اشتباه است");
  return;
 }

 el("loginPanel").style.display="none";
 el("rolePanel").style.display="block";
}

function setStatus(t){
 el("status").textContent=t;
}

function startConnection(selectedRole){
 if(peer)return;

 role=selectedRole;
 el("rolePanel").style.display="none";
 el("appPanel").style.display="block";

 if(role==="host"){
  setStatus("این گوشی میزبان است؛ منتظر گوشی دوم...");
 }else{
  setStatus("این گوشی دوم است؛ دنبال گوشی اول می‌گردد...");
 }

peer=new Peer(role==="host"?HOST:GUEST,{
  host:"0.peerjs.com",
  port:443,
  path:"/",
  secure:true,
  debug:3,
  pingInterval:5000,
  config:{
    iceServers:[
      {urls:"stun:stun.l.google.com:19302"}
    ]
  }
});

 peer.on("open",()=>{
  if(role==="host"){
   setStatus("گوشی اول آماده است؛ حالا گوشی دوم وارد شود.");
  }else{
   setStatus("گوشی دوم آماده است؛ در حال پیدا کردن گوشی اول...");
   connectHost();
   retryTimer=setInterval(connectHost,4000);
  }
 });

 peer.on("connection",c=>{
  if(role==="host"){
   attachConnection(c);
  }
 });

 peer.on("call",call=>{
  incomingCall=call;
  el("answerBtn").style.display="block";
  el("callStatus").textContent="تماس ورودی؛ پاسخ بده";
 });

 peer.on("error",e=>{
  console.log("PeerJS error:",e.type,e);
  connecting=false;

  if(attemptTimer){
   clearTimeout(attemptTimer);
   attemptTimer=null;
  }

  if(e.type==="unavailable-id"){
   setStatus("این نقش قبلاً در یک گوشی دیگر فعال شده است. نقش گوشی را بررسی کن.");
  }else if(e.type==="peer-unavailable"){
   setStatus("گوشی اول هنوز آنلاین نیست؛ دوباره تلاش می‌کنم...");
  }else{
   setStatus("خطای اتصال: "+e.type);
  }
 });

 peer.on("disconnected",()=>{
  setStatus("ارتباط با سرور قطع شد؛ تلاش مجدد...");
  if(peer&&!peer.destroyed)peer.reconnect();
 });
}

function connectHost(){
 if(role!=="guest"||!peer||peer.destroyed)return;
 if(conn&&conn.open)return;
 if(connecting)return;

 connecting=true;
 setStatus("در حال پیدا کردن گوشی اول...");

 try{
  const c=peer.connect(HOST,{
   reliable:true,
   serialization:"json"
  });

  attachConnection(c);

  attemptTimer=setTimeout(()=>{
   if(!c.open){
    connecting=false;
    try{c.close()}catch(e){}
   }
  },7000);

 }catch(e){
  connecting=false;
 }
}

function attachConnection(c){
 if(conn&&conn!==c&&conn.open){
  c.close();
  return;
 }

 conn=c;

 c.on("open",()=>{
  connecting=false;
  if(attemptTimer){
   clearTimeout(attemptTimer);
   attemptTimer=null;
  }

  if(retryTimer){
   clearInterval(retryTimer);
   retryTimer=null;
  }

  setStatus("چت دوطرفه متصل شد");
  el("msgInput").disabled=false;
  el("sendBtn").disabled=false;
  el("callBtn").disabled=false;
  addMessage("سیستم","اتصال برقرار شد",false);
 });

 c.on("data",data=>{
  if(data&&data.type==="msg"){
   addMessage("طرف مقابل",String(data.text||""),false);
  }
 });

 c.on("close",()=>{
  if(conn===c)conn=null;
  connecting=false;
  el("msgInput").disabled=true;
  el("sendBtn").disabled=true;
  el("callBtn").disabled=true;
  setStatus("چت قطع شد");

  if(role==="guest"&&!retryTimer){
   retryTimer=setInterval(connectHost,4000);
  }
 });

 c.on("error",()=>{
  connecting=false;
 });
}

function addMessage(name,text,mine){
 const d=document.createElement("div");
 d.className="msg"+(mine?" mine":"");
 const b=document.createElement("b");
 b.textContent=name+": ";
 d.appendChild(b);
 d.appendChild(document.createTextNode(text));
 el("messages").appendChild(d);
 el("messages").scrollTop=el("messages").scrollHeight;
}

function sendMessage(){
 const input=el("msgInput");
 const text=input.value.trim();

 if(!text||!conn||!conn.open)return;

 conn.send({type:"msg",text});
 addMessage("من",text,true);
 input.value="";
}

el("msgInput").addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

async function getMicrophone(){
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
  throw new Error("مرورگر به میکروفون دسترسی ندارد");
 }

 if(!localStream||!localStream.active){
  localStream=await navigator.mediaDevices.getUserMedia({
   audio:true,
   video:false
  });
 }
 return localStream;
}

function setupCall(call){
 activeCall=call;
 incomingCall=null;
 el("answerBtn").style.display="none";
 el("hangBtn").disabled=false;
 el("callStatus").textContent="در حال اتصال صوتی...";

 call.on("stream",stream=>{
  const audio=el("remoteAudio");
  audio.srcObject=stream;

  audio.play().then(()=>{
   el("audioBtn").style.display="none";
  }).catch(()=>{
   el("audioBtn").style.display="block";
  });

  el("callStatus").textContent="تماس صوتی برقرار است";
 });

 call.on("close",cleanCall);

 call.on("error",e=>{
  console.log("Call error:",e);
  el("callStatus").textContent="خطا در تماس صوتی";
 });
}

async function makeCall(){
 if(!peer||peer.destroyed){
  alert("اتصال آماده نیست");
  return;
 }

 try{
  const stream=await getMicrophone();
  const target=role==="host"?GUEST:HOST;
  const call=peer.call(target,stream);

  if(!call)throw new Error("تماس شروع نشد");

  setupCall(call);

 }catch(e){
  alert("خطای تماس: "+e.message);
 }
}

async function answerCall(){
 if(!incomingCall)return;

 try{
  const stream=await getMicrophone();
  const call=incomingCall;
  call.answer(stream);
  setupCall(call);
 }catch(e){
  alert("خطای میکروفون: "+e.message);
 }
}

function cleanCall(){
 activeCall=null;
 incomingCall=null;
 el("remoteAudio").srcObject=null;
 el("hangBtn").disabled=true;
 el("answerBtn").style.display="none";
 el("audioBtn").style.display="none";
 el("callStatus").textContent="تماس پایان یافت";
}

function hangup(){
 if(activeCall)activeCall.close();
 if(incomingCall)incomingCall.close();
 cleanCall();
}

function playAudio(){
 el("remoteAudio").play().then(()=>{
  el("audioBtn").style.display="none";
 }).catch(()=>{});
}
</script>
</body>
</html>
