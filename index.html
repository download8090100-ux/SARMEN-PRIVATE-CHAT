
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SARMEN PRIVATE</title>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#090b10;color:#eee;
  font-family:Tahoma,Arial,sans-serif;
  min-height:100vh;display:flex;justify-content:center;
  align-items:center;padding:15px
}
.container{
  width:100%;max-width:520px;background:#121722;
  border:1px solid #293243;border-radius:20px;
  padding:22px;box-shadow:0 15px 50px #0008
}
h1{text-align:center;color:#e63946;letter-spacing:3px}
.subtitle{text-align:center;color:#8994a7;font-size:13px;margin-bottom:25px}
input,button{
  width:100%;padding:14px;border-radius:10px;
  border:1px solid #303b4e;background:#0b1019;
  color:white;font-size:15px;margin-top:10px
}
button{background:#b51f30;border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
.secondary{background:#29364a}
.green{background:#167b55}
.status{
  background:#0b1019;padding:13px;border-radius:10px;
  color:#aab5c7;font-size:13px;margin:15px 0;
  text-align:center;line-height:1.8
}
#chatPanel{display:none}
.messages{
  height:320px;overflow-y:auto;background:#090e17;
  border:1px solid #263144;border-radius:12px;
  padding:12px;margin:15px 0
}
.message{margin:10px 0;display:flex;flex-direction:column}
.message .who{font-size:11px;color:#e65b67;margin-bottom:4px}
.message .bubble{
  background:#202c3d;padding:10px 13px;
  border-radius:12px;max-width:85%;overflow-wrap:anywhere
}
.message.mine{align-items:flex-start}
.message.mine .bubble{background:#8e2634}
.sendrow{display:flex;gap:8px}
.sendrow input{flex:1;min-width:0}
.sendrow button{width:85px;flex-shrink:0}
.callbox{
  border:1px solid #303b4e;border-radius:12px;
  padding:15px;margin-top:15px;text-align:center
}
.callbox button{margin-top:8px}
#answerBtn,#playAudioBtn{display:none}
.small{font-size:11px;color:#778398;text-align:center;margin-top:18px}
</style>
</head>

<body>
<div class="container">

  <h1>SARMEN</h1>
  <div class="subtitle">PRIVATE CHAT & VOICE CALL</div>

  <div id="loginPanel">
    <input id="username" value="movsesian"; placeholder="نام کاربری">
    <input id="password" type="11arsineh11"; placeholder="رمز عبور">
    <button id="loginBtn" onclick="login()">ورود به سایت</button>
    <div class="small">SARMEN PRIVATE CONNECTION</div>
  </div>

  <div id="chatPanel">
    <div class="status" id="status">در حال آماده‌سازی اتصال...</div>

    <div class="messages" id="messages"></div>

    <div class="sendrow">
      <input id="messageInput" placeholder="پیام خود را بنویسید..." disabled>
      <button id="sendBtn" onclick="sendMessage()" disabled>ارسال</button>
    </div>

    <div class="callbox">
      <div style="font-weight:bold;margin-bottom:8px">تماس صوتی دوطرفه</div>
      <div id="callStatus" class="small">آماده تماس</div>

      <button id="callBtn" class="green" onclick="startCall()" disabled>
        شروع تماس صوتی
      </button>

      <button id="answerBtn" onclick="answerCall()">
        پاسخ به تماس
      </button>

      <button id="hangupBtn" class="secondary" onclick="hangup()" disabled>
        قطع تماس
      </button>

      <audio id="remoteAudio" autoplay playsinline></audio>
      <button id="playAudioBtn" class="secondary" onclick="playRemoteAudio()">
        پخش صدای طرف مقابل
      </button>
    </div>

    <button class="secondary" onclick="logout()">خروج از حساب</button>
  </div>

</div>

<script>
// فقط این دو خط را تنظیم کن
const USERNAME = "movsesian";
const PASSWORD = "CHANGE_THIS_PASSWORD";

// شناسه‌های داخلی اتصال؛ در صفحه نمایش داده نمی‌شوند
function hashString(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h,16777619);
  }
  return (h>>>0).toString(36);
}

const token = hashString(USERNAME.toLowerCase()+"|"+PASSWORD);
const hostId = "sm-"+token+"-h";
const guestId = "sm-"+token+"-g";

let peer = null;
let role = null;
let dataConn = null;
let connecting = false;
let retryTimer = null;
let localStream = null;
let currentCall = null;
let pendingCall = null;

const $ = id => document.getElementById(id);

function setStatus(text){
  $("status").textContent = text;
}

function login(){
  const u = $("username").value.trim().toLowerCase();
  const p = $("password").value;

  if(u !== USERNAME.toLowerCase() || p !== PASSWORD){
    alert("نام کاربری یا رمز عبور اشتباه است");
    return;
  }

  $("loginPanel").style.display = "none";
  $("chatPanel").style.display = "block";

  setStatus("در حال اتصال به سرور...");
  startPeer("host");
}

function startPeer(wantedRole){
  role = wantedRole;
  const myId = role === "host" ? hostId : guestId;

  try{
    peer = new Peer(myId,{
      debug:1,
      config:{
        iceServers:[
          {urls:"stun:stun.l.google.com:19302"}
        ]
      }
    });
  }catch(e){
    setStatus("خطا در ساخت اتصال: "+e.message);
    return;
  }

  peer.on("open",()=>{
    if(role === "host"){
      setStatus("سایت آماده است؛ منتظر اتصال گوشی دوم...");
    }else{
      setStatus("در حال پیدا کردن گوشی اول...");
      connectToHost();
      retryTimer = setInterval(connectToHost,4000);
    }

    $("callBtn").disabled = false;
  });

  peer.on("error",err=>{
    console.log("Peer error:",err.type,err);

    if(err.type === "unavailable-id" && role === "host"){
      peer.destroy();
      peer = null;
      setStatus("در حال اتصال گوشی دوم...");
      setTimeout(()=>startPeer("guest"),700);
      return;
    }

    if(err.type === "unavailable-id" && role === "guest"){
      setStatus("هر دو جایگاه اتصال اشغال هستند. بعداً دوباره تلاش کنید.");
      return;
    }

    if(err.type === "peer-unavailable"){
      setStatus("منتظر آماده شدن گوشی اول...");
      return;
    }

    setStatus("خطای اتصال: "+err.type);
  });

  peer.on("connection",conn=>{
    attachDataConnection(conn);
  });

  peer.on("call",call=>{
    pendingCall = call;
    $("answerBtn").style.display = "block";
    $("callStatus").textContent = "تماس ورودی؛ برای پاسخ دکمه را بزنید";
  });

  peer.on("disconnected",()=>{
    setStatus("ارتباط با سرور قطع شد؛ در حال تلاش مجدد...");
    try{peer.reconnect()}catch(e){}
  });
}

function connectToHost(){
  if(role !== "guest" || !peer || peer.destroyed) return;
  if(dataConn && dataConn.open) return;
  if(connecting) return;

  connecting = true;

  try{
    const conn = peer.connect(hostId,{
      reliable:true,
      serialization:"json"
    });

    attachDataConnection(conn);

    conn.on("open",()=>{
      connecting = false;
    });

    conn.on("error",()=>{
      connecting = false;
    });

  }catch(e){
    connecting = false;
  }
}

function attachDataConnection(conn){
  dataConn = conn;

  conn.on("open",()=>{
    connecting = false;
    setStatus("اتصال چت برقرار شد");
    $("messageInput").disabled = false;
    $("sendBtn").disabled = false;

    if(retryTimer){
      clearInterval(retryTimer);
      retryTimer = null;
    }

    appendMessage("سیستم","اتصال برقرار شد",false);
  });

  conn.on("data",data=>{
    if(data && data.type === "message"){
      appendMessage("طرف مقابل",String(data.text || ""),false);
    }
  });

  conn.on("close",()=>{
    if(dataConn === conn) dataConn = null;
    connecting = false;

    $("messageInput").disabled = true;
    $("sendBtn").disabled = true;
    setStatus("چت قطع شد؛ در حال تلاش برای اتصال مجدد...");

    if(role === "guest" && !retryTimer){
      retryTimer = setInterval(connectToHost,4000);
    }
  });

  conn.on("error",()=>{
    connecting = false;
  });
}

function appendMessage(who,text,mine){
  const box = document.createElement("div");
  box.className = "message"+(mine ? " mine" : "");

  const name = document.createElement("div");
  name.className = "who";
  name.textContent = who;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  box.appendChild(name);
  box.appendChild(bubble);

  $("messages").appendChild(box);
  $("messages").scrollTop = $("messages").scrollHeight;
}

function sendMessage(){
  const input = $("messageInput");
  const text = input.value.trim();

  if(!text || !dataConn || !dataConn.open) return;

  dataConn.send({type:"message",text:text});
  appendMessage("من",text,true);
  input.value = "";
}

$("messageInput").addEventListener("keydown",e=>{
  if(e.key === "Enter") sendMessage();
});

async function getMicrophone(){
  if(localStream && localStream.active) return localStream;

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    throw new Error("مرورگر یا اتصال امن HTTPS از میکروفون پشتیبانی نمی‌کند");
  }

  localStream = await navigator.mediaDevices.getUserMedia({
    audio:true,
    video:false
  });

  return localStream;
}

function attachMediaCall(call){
  currentCall = call;
  pendingCall = null;

  $("answerBtn").style.display = "none";
  $("hangupBtn").disabled = false;
  $("callStatus").textContent = "در حال برقراری تماس...";

  call.on("stream",stream=>{
    $("remoteAudio").srcObject = stream;
    $("remoteAudio").play().then(()=>{
      $("playAudioBtn").style.display = "none";
    }).catch(()=>{
      $("playAudioBtn").style.display = "block";
    });

    $("callStatus").textContent = "تماس صوتی برقرار است";
  });

  call.on("close",cleanupCall);

  call.on("error",err=>{
    console.log("Call error:",err);
    $("callStatus").textContent = "خطا در تماس صوتی";
  });
}

async function startCall(){
  if(!peer || peer.destroyed){
    alert("اتصال هنوز آماده نیست");
    return;
  }

  try{
    $("callStatus").textContent = "در حال دسترسی به میکروفون...";
    const stream = await getMicrophone();
    const target = role === "host" ? guestId : hostId;

    const call = peer.call(target,stream);

    if(!call){
      $("callStatus").textContent = "شروع تماس ممکن نشد";
      return;
    }

    attachMediaCall(call);

  }catch(e){
    alert("دسترسی به میکروفون ممکن نشد: "+e.message);
    $("callStatus").textContent = "میکروفون در دسترس نیست";
  }
}

async function answerCall(){
  if(!pendingCall) return;

  try{
    const stream = await getMicrophone();
    const call = pendingCall;
    pendingCall = null;

    call.answer(stream);
    attachMediaCall(call);

  }catch(e){
    alert("برای پاسخ به تماس باید اجازه میکروفون بدهید: "+e.message);
  }
}

function cleanupCall(){
  currentCall = null;
  pendingCall = null;
  $("remoteAudio").srcObject = null;
  $("answerBtn").style.display = "none";
  $("playAudioBtn").style.display = "none";
  $("hangupBtn").disabled = true;
  $("callStatus").textContent = "تماس پایان یافت";
}

function hangup(){
  if(currentCall){
    currentCall.close();
  }
  if(pendingCall){
    pendingCall.close();
  }
  cleanupCall();
}

function playRemoteAudio(){
  $("remoteAudio").play().then(()=>{
    $("playAudioBtn").style.display = "none";
  }).catch(()=>{});
}

function logout(){
  if(retryTimer) clearInterval(retryTimer);
  retryTimer = null;

  hangup();

  if(dataConn){
    dataConn.close();
    dataConn = null;
  }

  if(peer){
    peer.destroy();
    peer = null;
  }

  if(localStream){
    localStream.getTracks().forEach(track=>track.stop());
    localStream = null;
  }

  $("messages").innerHTML = "";
  $("password").value = "";
  $("chatPanel").style.display = "none";
  $("loginPanel").style.display = "block";
  $("messageInput").disabled = true;
  $("sendBtn").disabled = true;
  $("callBtn").disabled = true;
}
</script>
</body>
</html>
