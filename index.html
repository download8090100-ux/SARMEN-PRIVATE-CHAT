
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SARMEN PRIVATE CHAT</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080808;color:white;
 font-family:Tahoma,Arial,sans-serif;
}
.app{
 width:100%;max-width:520px;margin:auto;
 min-height:100vh;padding:20px;
}
header{text-align:center;padding:22px}
.logo{font-size:32px;color:#ff2424;font-weight:bold;letter-spacing:4px}
.sub{font-size:11px;color:#777;margin-top:9px}
.panel{
 background:#151515;border:1px solid #333;
 border-radius:14px;padding:17px;margin-bottom:15px;
}
h3{margin-top:0;color:#ff3535}
input{
 width:100%;padding:14px;margin:7px 0;
 border:1px solid #393939;border-radius:8px;
 background:#090909;color:white;font-size:15px;
}
button{
 border:0;border-radius:9px;padding:14px;
 background:#d71920;color:white;font-size:15px;
 font-weight:bold;cursor:pointer;
}
button:disabled{opacity:.4}
.full{width:100%;margin-top:9px}
.secondary{background:#303030}
.green{background:#146d43}
.status{text-align:center;color:#aaa;font-size:12px;padding:8px}
#chatPanel{display:none}
#messages{
 height:310px;overflow:auto;background:#090909;
 border:1px solid #303030;border-radius:10px;
 padding:10px;
}
.msg{
 background:#292929;padding:11px;
 margin:8px 0;border-radius:10px;
 overflow-wrap:anywhere;
}
.mine{background:#641818;text-align:left}
.controls{display:flex;gap:8px}
.controls button{flex:1}
.footer{text-align:center;color:#555;font-size:10px;padding:20px}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="logo">SARMEN</div>
 <div class="sub">PRIVATE CHAT & VOICE CALL</div>
</header>

<div class="panel" id="connectPanel">
 <h3>ورود به اتاق خصوصی</h3>
 <input id="room" placeholder="کد اتاق مشترک">
 <button class="full" onclick="connectRoom()">ورود به اتاق</button>
 <div class="status" id="status">آماده اتصال</div>
 <div class="status">هر دو نفر باید دقیقاً یک کد اتاق وارد کنند.</div>
</div>

<div id="chatPanel">
 <div class="panel">
  <h3>وضعیت ارتباط</h3>
  <div class="status" id="connectionStatus">در انتظار اتصال طرف مقابل</div>
  <div class="controls">
   <button id="callBtn" onclick="startCall()" disabled>تماس صوتی</button>
   <button class="secondary" onclick="endCall()">قطع تماس</button>
  </div>
  <audio id="remoteAudio" autoplay playsinline></audio>
  <div class="status" id="callStatus">تماس برقرار نشده</div>
  <button class="full secondary" id="muteBtn" onclick="toggleMute()" disabled>قطع میکروفون</button>
 </div>

 <div class="panel">
  <h3>پیام‌ها</h3>
  <div id="messages">
   <div class="status">به SARMEN خوش آمدید</div>
  </div>
  <input id="message" placeholder="پیام خود را بنویسید..."
   onkeydown="if(event.key==='Enter')sendMessage()">
  <button class="full" onclick="sendMessage()">ارسال پیام</button>
 </div>

 <button class="full secondary" onclick="leaveRoom()">خروج از اتاق</button>
</div>

<div class="footer">SARMEN © 2026</div>
</div>

<script>
let peer=null;
let conn=null;
let currentCall=null;
let localStream=null;
let muted=false;
let otherPeer=null;
let roomCode="";

const $=id=>document.getElementById(id);

function setStatus(t){$("status").textContent=t}

function addMessage(t,mine){
 const d=document.createElement("div");
 d.className="msg"+(mine?" mine":"");
 d.textContent=t;
 $("messages").appendChild(d);
 $("messages").scrollTop=$("messages").scrollHeight;
}

function connectRoom(){
 roomCode=$("room").value.trim();

 if(!/^[a-zA-Z0-9_-]{3,30}$/.test(roomCode)){
  setStatus("کد اتاق باید حداقل ۳ حرف یا عدد باشد");
  return;
 }

 $("connectPanel").style.display="none";
 $("chatPanel").style.display="block";
 setStatus("در حال اتصال...");

 // اتاق از طریق یک شناسه مشترک ساخته می‌شود.
 const myId="sarmen-"+roomCode+"-"+Math.random().toString(36).slice(2,10);
 peer=new Peer(myId);

 peer.on("open",()=>{
  $("connectionStatus").textContent="شناسه شما آماده است";
  $("callBtn").disabled=false;
  $("callStatus").textContent="برای تماس، طرف مقابل باید شناسه خود را به شما بدهد";
 });

 peer.on("connection",c=>{
  conn=c;
  setupConnection();
 });

 peer.on("call",call=>{
  currentCall=call;
  answerIncomingCall();
 });

 peer.on("error",e=>{
  $("connectionStatus").textContent="خطا: "+e.type;
 });

 $("connectionStatus").textContent=
 "شناسه شما: "+myId;
}

function setupConnection(){
 if(!conn)return;

 conn.on("open",()=>{
  $("connectionStatus").textContent="چت متصل شد";
 });

 conn.on("data",data=>{
  if(data.type==="message")addMessage("دوست: "+data.text,false);
 });

 conn.on("close",()=>{
  $("connectionStatus").textContent="ارتباط قطع شد";
 });
}

function sendMessage(){
 const t=$("message").value.trim();
 if(!t)return;

 if(!conn || !conn.open){
  alert("هنوز به طرف مقابل متصل نیستید");
  return;
 }

 conn.send({type:"message",text:t});
 addMessage("من: "+t,true);
 $("message").value="";
}

async function getMic(){
 if(!localStream){
  localStream=await navigator.mediaDevices.getUserMedia({
   audio:true,video:false
  });
 }
 return localStream;
}

async function startCall(){
 try{
  if(!otherPeer){
   const id=prompt("شناسه Peer دوستت را وارد کن:");
   if(!id)return;
   otherPeer=id.trim();
  }

  const stream=await getMic();
  currentCall=peer.call(otherPeer,stream);
  handleCall(currentCall);
 }catch(e){
  alert("دسترسی میکروفون ممکن نشد: "+e.message);
 }
}

async function answerIncomingCall(){
 try{
  const stream=await getMic();
  currentCall.answer(stream);
  handleCall(currentCall);
 }catch(e){
  alert("دسترسی میکروفون ممکن نشد: "+e.message);
 }
}

function handleCall(call){
 call.on("stream",stream=>{
  $("remoteAudio").srcObject=stream;
  $("callStatus").textContent="تماس صوتی برقرار است";
  $("muteBtn").disabled=false;
 });

 call.on("close",()=>{
  $("remoteAudio").srcObject=null;
  $("callStatus").textContent="تماس پایان یافت";
 });

 call.on("error",e=>{
  $("callStatus").textContent="خطای تماس: "+e.message;
 });
}

function toggleMute(){
 if(!localStream)return;
 muted=!muted;
 localStream.getAudioTracks().forEach(t=>t.enabled=!muted);
 $("muteBtn").textContent=muted?"روشن کردن میکروفون":"قطع میکروفون";
}

function endCall(){
 if(currentCall)currentCall.close();
 currentCall=null;

 if(localStream){
  localStream.getTracks().forEach(t=>t.stop());
  localStream=null;
 }

 $("remoteAudio").srcObject=null;
 $("callStatus").textContent="تماس پایان یافت";
 $("muteBtn").disabled=true;
 muted=false;
 $("muteBtn").textContent="قطع میکروفون";
}

function leaveRoom(){
 endCall();
 if(conn)conn.close();
 if(peer)peer.destroy();
 conn=null;
 peer=null;
 $("chatPanel").style.display="none";
 $("connectPanel").style.display="block";
 $("connectionStatus").textContent="ارتباط قطع شد";
}
</script>
</body>
</html>
