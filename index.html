
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SARMEN PRIVATE CHAT</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101116;color:#eee;font-family:Arial,sans-serif}
.container{max-width:600px;margin:auto;padding:18px}
header{text-align:center;padding:20px 0}
.logo{font-size:34px;font-weight:bold;color:#e63946;letter-spacing:5px}
.sub{color:#999;font-size:12px;letter-spacing:3px;margin-top:7px}
.panel{background:#1b1d25;border:1px solid #30333e;border-radius:16px;padding:18px;margin:14px 0}
input{width:100%;padding:14px;border-radius:9px;border:1px solid #444;background:#101116;color:white;font-size:16px;margin:8px 0}
button{border:0;border-radius:9px;padding:13px 16px;background:#d92739;color:white;font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4}
.secondary{background:#343744}
.row{display:flex;gap:9px;margin:10px 0}
.row button{flex:1}
#chat{height:330px;overflow-y:auto;background:#101116;border-radius:10px;padding:12px}
.msg{padding:10px 12px;border-radius:12px;margin:8px 0;max-width:85%;background:#30333e;overflow-wrap:anywhere}
.mine{background:#8e2431;margin-right:auto}
.small{font-size:12px;color:#aaa}
#status{color:#f0b84b;text-align:center;padding:10px;font-size:13px}
#app{display:none}
#remoteAudio{width:100%;margin-top:10px}
</style>
</head>
<body>
<div class="container">

<header>
  <div class="logo">SARMEN</div>
  <div class="sub">PRIVATE CHAT & VOICE</div>
</header>

<section id="login" class="panel">
  <h3>ورود به SARMEN</h3>
  <p class="small">نام کاربری: movsesian</p>
  <input id="password" type="password" placeholder="11arsine11">
  <div class="row">
    <button onclick="start('one')">گوشی اول</button>
    <button class="secondary" onclick="start('two')">گوشی دوم</button>
  </div>
  <p class="small">هر دو نفر باید رمز یکسان وارد کنند و نقش متفاوت انتخاب کنند.</p>
</section>

<section id="app">
  <div class="panel">
    <div id="status">در حال اتصال...</div>
    <div class="row">
      <button id="micButton" onclick="enableMic()">فعال‌سازی میکروفون</button>
      <button id="callButton" onclick="makeCall()" disabled>تماس صوتی</button>
    </div>
    <div class="row">
      <button class="secondary" onclick="endCall()">قطع تماس</button>
    </div>
    <audio id="remoteAudio" autoplay playsinline controls></audio>
  </div>

  <div class="panel">
    <h3>پیام‌های SARMEN</h3>
    <div id="chat"></div>
    <input id="message" placeholder="پیام خود را بنویسید..." onkeydown="if(event.key==='Enter')sendMessage()">
    <button style="width:100%" onclick="sendMessage()">ارسال پیام</button>
  </div>
</section>

</div>

<script>
const USERNAME = "movsesian";

const SERVER = "sarmen-private-chat.ethiodeploy.app";
const SERVER_PATH = "/peerjs";

let peer = null;
let connection = null;
let mediaCall = null;
let localStream = null;
let myRole = "";
let remoteRole = "";
let remotePeerId = "";
let reconnectTimer = null;
let connecting = false;

const statusBox = document.getElementById("status");
const chatBox = document.getElementById("chat");
const remoteAudio = document.getElementById("remoteAudio");

function status(text) {
  statusBox.textContent = text;
}

function addMessage(text, mine, time) {
  const div = document.createElement("div");
  div.className = "msg" + (mine ? " mine" : "");

  const content = document.createElement("div");
  content.textContent = text;

  const stamp = document.createElement("div");
  stamp.className = "small";
  stamp.textContent = time || new Date().toLocaleTimeString();

  div.appendChild(content);
  div.appendChild(stamp);
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

async function makeIds(password) {
  const data = new TextEncoder().encode(USERNAME + "|" + password);
  const hash = await crypto.subtle.digest("SHA-256", data);

  const hex = Array.from(new Uint8Array(hash))
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");

  return {
    one: "sarmen-" + hex.slice(0, 24) + "-one",
    two: "sarmen-" + hex.slice(0, 24) + "-two"
  };
}

async function start(role) {
  const password = document.getElementById("password").value;

  if (!password || password.length < 8) {
    alert("رمز عبور باید حداقل ۸ کاراکتر باشد.");
    return;
  }

  if (!window.crypto || !crypto.subtle) {
    alert("مرورگر از رمزنگاری امن پشتیبانی نمی‌کند.");
    return;
  }

  myRole = role;
  remoteRole = role === "one" ? "two" : "one";

  const ids = await makeIds(password);
  const myId = ids[myRole];
  remotePeerId = ids[remoteRole];

  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";

  status("در حال اتصال به سرور SARMEN...");

  peer = new Peer(myId, {
    host: SERVER,
    port: 443,
    path: SERVER_PATH,
    secure: true,
    debug: 1,
    config: {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" }
      ]
    }
  });

  peer.on("open", () => {
    status("به سرور وصل شدی؛ منتظر گوشی دیگر...");
    document.getElementById("callButton").disabled = false;

    if (myRole === "two") {
      connectToFirst();
    }
  });

  peer.on("connection", conn => {
    setupConnection(conn);
  });

  peer.on("call", incomingCall => {
    if (!localStream) {
      mediaCall = incomingCall;
      status("تماس ورودی؛ ابتدا میکروفون را فعال کن.");
      return;
    }
    answerCall(incomingCall);
  });

  peer.on("disconnected", () => {
    status("ارتباط با سرور قطع شد؛ تلاش برای اتصال مجدد...");
    if (!peer.destroyed) {
      peer.reconnect();
    }
  });

  peer.on("error", err => {
    console.error(err);
    status("خطای سرور: " + err.type);

    if (err.type === "unavailable-id") {
      status("این نقش قبلاً در دستگاه دیگری فعال شده است.");
    }
  });
}

function connectToFirst() {
  if (!peer || peer.destroyed || connection || connecting) return;

  connecting = true;
  status("در حال پیدا کردن گوشی اول...");

  const conn = peer.connect(remotePeerId, {
    reliable: true
  });

  setupConnection(conn);

  conn.on("open", () => {
    connecting = false;
  });

  conn.on("error", () => {
    connecting = false;
  });
}

function setupConnection(conn) {
  if (connection && connection.open) return;

  connection = conn;

  conn.on("open", () => {
    connecting = false;
    status("دو گوشی به هم متصل شدند.");
    addMessage("ارتباط برقرار شد.", false);
  });

  conn.on("data", data => {
    if (data && data.type === "chat") {
      addMessage(data.text, false, data.time);
    }
  });

  conn.on("close", () => {
    connection = null;
    connecting = false;
    status("ارتباط چت قطع شد.");

    if (myRole === "two") {
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connectToFirst, 3000);
    }
  });

  conn.on("error", err => {
    console.error(err);
    connecting = false;
    status("خطا در ارتباط چت.");
  });
}

function sendMessage() {
  const input = document.getElementById("message");
  const text = input.value.trim();

  if (!text) return;

  if (!connection || !connection.open) {
    alert("هنوز گوشی دیگر متصل نشده است.");
    return;
  }

  const time = new Date().toLocaleTimeString();

  connection.send({
    type: "chat",
    text,
    time
  });

  addMessage(text, true, time);
  input.value = "";
}

async function enableMic() {
  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: false
    });

    document.getElementById("micButton").textContent = "میکروفون فعال است";
    status("میکروفون فعال شد.");

    if (mediaCall) {
      const incoming = mediaCall;
      mediaCall = null;
      answerCall(incoming);
    }
  } catch (err) {
    alert("دسترسی به میکروفون داده نشد: " + err.message);
  }
}

function makeCall() {
  if (!peer || !peer.open) {
    alert("سرور هنوز متصل نیست.");
    return;
  }

  if (!localStream) {
    alert("اول میکروفون را فعال کن.");
    return;
  }

  if (mediaCall) {
    alert("تماس در حال حاضر برقرار است.");
    return;
  }

  status("در حال تماس با گوشی دیگر...");

  mediaCall = peer.call(remotePeerId, localStream);
  setupMediaCall(mediaCall);
}

function answerCall(call) {
  if (!localStream) return;

  call.answer(localStream);
  mediaCall = call;
  setupMediaCall(call);
}

function setupMediaCall(call) {
  call.on("stream", stream => {
    remoteAudio.srcObject = stream;
    remoteAudio.play().catch(() => {
      status("برای شنیدن صدا، پخش صدا را لمس کن.");
    });
    status("تماس صوتی برقرار شد.");
  });

  call.on("close", () => {
    mediaCall = null;
    remoteAudio.srcObject = null;
    status("تماس پایان یافت.");
  });

  call.on("error", err => {
    console.error(err);
    status("خطا در تماس صوتی.");
  });
}

function endCall() {
  if (mediaCall) {
    mediaCall.close();
    mediaCall = null;
  }

  remoteAudio.srcObject = null;
  status("تماس قطع شد.");
}

window.addEventListener("beforeunload", () => {
  clearTimeout(reconnectTimer);
  if (mediaCall) mediaCall.close();
  if (connection) connection.close();
  if (peer) peer.destroy();
});
</script>
</body>
</html>
